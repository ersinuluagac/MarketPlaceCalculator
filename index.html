<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="row text-center">
          <h1>E-Ticaret Kâr Hesaplayıcı</h1>

          <form id="calculatorForm">
            <div class="row mt-5">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-tag"></i></span>
                  <input type="number" step="0.1" class="form-control" id="salePrice" name="salePrice" placeholder="Satış fiyatı"
                    required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-percent"></i></span>
                  <input type="number" step="0.1" class="form-control" id="commission" name="commission" placeholder="Komisyon oranı"
                    required>
                </div>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-upc-scan"></i></span>
                  <input type="number" step="0.1" class="form-control" id="cost" name="cost" placeholder="Ürün Maliyeti (KDV Hariç)"
                    required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-percent"></i></span>
                  <select class="form-select" id="vatRate" name="vatRate" required>
                    <option selected disabled>KDV Oranı</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-truck"></i></span>
                  <select class="form-select" id="shippingCompany" name="shippingCompany" required>
                    <option selected disabled>Kargo firması</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-box-seam"></i></span>
                  <input type="number" class="form-control" id="volWeight" name="volWeight" placeholder="Desi (0-30)" min="0" max="30"
                    required>
                </div>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12 col-md-6">
                <input id="calculate" class="btn btn-success w-100" value="Hesapla">
              </div>
              <div class="col-12 col-md-6">
                <button id="clear" type="button" class="btn btn-outline-danger w-100">Temizle</button>
              </div>
            </div>
          </form>

          <h1 class="mt-3">Hesaplananlar</h1>
          <div id="result" class="mt-3">

          </div>
        </div>
      </div>
    </div>
  </div>

  
  <!-- Script Area -->
  <script type="module" src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
