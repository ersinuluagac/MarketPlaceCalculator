<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="row text-center">
          <h1>Pazaryeri Kâr Hesaplama Aracı</h1>

          <form id="calculatorForm" class="row g-3 mt-4">

            <div class="col-12 col-md-6">
              <div class="input-group" data-bs-toggle="tooltip" data-bs-placement="top"
                data-bs-title="Ürünün KDV dahil pazaryerindeki satış fiyatını giriniz.">
                <span class="input-group-text"><i class="bi bi-tag"></i></span>
                <input type="number" min="0.1" step="0.1" class="form-control" id="salePrice" name="salePrice"
                  placeholder="Satış Fiyatı" required>
              </div>
            </div>

            <div class="col-12 col-md-6">
              <div class="input-group" data-bs-toggle="tooltip" data-bs-placement="top"
                data-bs-title="Pazaryerinin komisyon oranını giriniz.">
                <span class="input-group-text"><i class="bi bi-percent"></i></span>
                <input type="number" step="0.1" class="form-control" id="commissionRate" name="commissionRate"
                  placeholder="Komisyon Oranı" required>
              </div>
            </div>

            <div class="col-12 col-md-6">
              <div class="input-group" data-bs-toggle="tooltip" data-bs-placement="top"
                data-bs-title="Ürünün KDV hariç fiyatını giriniz.">
                <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                <input type="number" step="0.1" class="form-control" id="productCost" name="productCost"
                  placeholder="Ürün Maliyeti (KDV Hariç)" required>
              </div>
            </div>

            <div class="col-12 col-md-6">
              <div class="input-group" data-bs-toggle="tooltip" data-bs-placement="top"
                data-bs-title="Ürünün KDV oranını seçiniz.">
                <span class="input-group-text"><i class="bi bi-tags"></i></span>
                <select class="form-select" id="productVatRate" name="productVatRate" required>
                  <option value="" selected disabled hidden>Ürün KDV Oranı</option>
                  <option value="1">0</option>
                  <option value="1.01">1</option>
                  <option value="1.10">10</option>
                  <option value="1.20">20</option>
                </select>
              </div>
            </div>

            <div class="col-12 col-md-6">
              <div class="input-group" data-bs-toggle="tooltip" data-bs-placement="top"
                data-bs-title="Ürünün hangi kargo firması ile göndereceğiniz seçin.">
                <span class="input-group-text"><i class="bi bi-truck"></i></span>
                <select class="form-select" id="shippingCompany" name="shippingCompany" required>
                  <option value="" selected disabled hidden>Kargo firması</option>
                </select>
              </div>
            </div>

            <div class="col-12 col-md-6">
              <div class="input-group" data-bs-toggle="tooltip" data-bs-placement="top"
                data-bs-title="Kargonun boyutunu gösteren desi değerini giriniz">
                <span class="input-group-text"><i class="bi bi-box-seam"></i></span>
                <input type="number" class="form-control" id="volumetricWeight" name="volumetricWeight"
                  placeholder="Kargo Desisi (0-30)" min="0" max="30" required>
              </div>
            </div>

            <div class="col-12 d-flex justify-content-center mt-4">
              <div class="col-12 col-lg-8 col-md-10">
                <button id="calculate" type="submit" class="btn btn-success btn-lg w-100 shadow-sm fw-bold rounded-3">
                  <i class="bi bi-calculator me-2"></i>Hesapla
                </button>
              </div>
            </div>

            <div class="col-12 d-flex justify-content-center mt-2">
              <div class="col-12 col-lg-8 col-md-10">
                <div class="row g-3">
                  <div class="col-12 col-sm-6">
                    <button id="clearForm" type="button" class="btn btn-outline-secondary w-100 rounded-3">
                      <i class="bi bi-eraser me-2"></i>Formu Temizle
                    </button>
                  </div>
                  <div class="col-12 col-sm-6">
                    <button id="clearResult" type="button" class="btn btn-outline-danger w-100 rounded-3">
                      <i class="bi bi-trash3 me-2"></i>Sonuçları Temizle
                    </button>
                  </div>
                </div>
              </div>
            </div>

          </form>

          <div id="result" class="mt-4">
            <!-- JS'e Aktarılacak -->

            <!-- JS'e aktarılacak. -->
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- Script Area -->
  <script type="module" src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

      </div>

    </div>
  </div>
