<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="row text-center">
          <h1>E-Ticaret Kâr Hesaplayıcı</h1>

          <form id="calculatorForm">
            <div class="row mt-5">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-tag"></i></span>
                  <input type="number" step="0.1" class="form-control" id="salePrice" placeholder="Satış fiyatı"
                    required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-percent"></i></span>
                  <input type="number" step="0.1" class="form-control" id="commission" placeholder="Komisyon oranı"
                    required>
                </div>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-upc-scan"></i></span>
                  <input type="number" step="0.1" class="form-control" id="cost" placeholder="Ürün Maliyeti (KDV Hariç)"
                    required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-percent"></i></span>
                  <select class="form-select" id="vatRate" required>
                    <option selected disabled>KDV Oranı</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-truck"></i></span>
                  <select class="form-select" id="shippingCompany" required>
                    <option selected disabled>Kargo firması</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text" id="visible-addon"><i class="bi bi-box-seam"></i></span>
                  <input type="number" class="form-control" id="desi" placeholder="Desi (0-30)" min="0" max="30"
                    required>
                </div>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12 col-md-6">
                <input id="calculate" type="button" class="btn btn-success w-100" value="Hesapla">
              </div>
              <div class="col-12 col-md-6">
                <button id="clear" type="button" class="btn btn-outline-danger w-100">Temizle</button>
              </div>
            </div>
          </form>

          <h1 class="mt-3">Hesaplananlar</h1>
          <div id="result" class="mt-3">
            <div class="card shadow-sm col-12 col-md-8 col-lg-6">
              <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0">125,50</h3>
                <small>Net Kâr</small>
              </div>
              <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  Komisyon Tutarı
                  <span class="fw-bold">45,00 ₺</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  Kargo Ücreti
                  <span class="fw-bold">35,00 ₺</span>
                </li>
                <li class="list-group-item p-0">
                  <div class="accordion accordion-flush" id="kdvAccordion">
                    <div class="accordion-item">
                      <h2 class="accordion-header">
                        <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse"
                          data-bs-target="#kdvDetay">
                          Vergi Detayları
                        </button>
                      </h2>
                      <div id="kdvDetay" class="accordion-collapse collapse" data-bs-parent="#kdvAccordion">
                        <div class="accordion-body bg-light small">
                          <div class="d-flex justify-content-between"><span>Satış KDV:</span> <span>50₺</span></div>
                          <div class="d-flex justify-content-between"><span>Alış KDV:</span> <span>-30₺</span></div>
                          <div class="d-flex justify-content-between fw-bold border-top mt-1"><span>Ödenecek:</span>
                            <span>20₺</span></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </li>
              </ul>
              <div class="card-body">
                <button class="btn btn-success w-100">Kaydet</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Script Area -->
  <script type="module" src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
